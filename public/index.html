<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TráficoYa · Incidencias de tráfico en Madrid</title>
  <meta name="description" content="Mapa en tiempo real de incidencias de tráfico en la Comunidad de Madrid, con datos abiertos de la DGT." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%A6%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1><span aria-hidden="true">🚦</span> TráficoYa</h1>
    <p class="subtitle">Incidencias de tráfico en tiempo real · Comunidad de Madrid</p>
    <div class="header-actions">
      <span id="estado" class="estado" role="status" aria-live="polite">Cargando…</span>
      <button id="btn-refrescar" type="button">Actualizar</button>
    </div>
  </header>

  <main>
    <div id="mapa"></div>

    <aside class="leyenda" aria-label="Leyenda de tipos de incidencia">
      <h2>Leyenda</h2>
      <ul>
        <li><span class="punto punto-obras"></span> Obras</li>
        <li><span class="punto punto-accidente"></span> Accidentes / daños</li>
        <li><span class="punto punto-resto"></span> Otras incidencias</li>
        <li><span class="punto punto-highest"></span> Severidad máxima</li>
      </ul>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>

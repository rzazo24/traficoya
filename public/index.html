<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>TráficoYa · Incidencias de tráfico en Madrid</title>
  <meta name="description" content="Mapa en tiempo real de incidencias de tráfico en la Comunidad de Madrid, con datos abiertos de la DGT." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TráficoYa" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>
      <span aria-hidden="true">🚦</span> TráficoYa
      <!-- Versión sincronizada a mano con "version" en package.json en cada despliegue con
           cambios visibles (mismo patrón que BusYa). Va aquí, no en .subtitle, para que
           siga visible en móvil aunque el subtítulo se oculte. -->
      <span class="version">v0.1.0</span>
    </h1>
    <p class="subtitle">Incidencias de tráfico en tiempo real · Comunidad de Madrid</p>
    <div class="header-actions">
      <span id="estado" class="estado" role="status" aria-live="polite">Cargando…</span>
      <button id="btn-refrescar" type="button">Actualizar</button>
    </div>
  </header>

  <main>
    <div id="mapa"></div>

    <aside class="leyenda" aria-label="Leyenda de tipos de incidencia">
      <h2>Leyenda</h2>
      <ul>
        <li><span class="punto punto-obras"></span> Obras</li>
        <li><span class="punto punto-accidente"></span> Accidentes / daños</li>
        <li><span class="punto punto-resto"></span> Otras incidencias</li>
        <li><span class="punto punto-highest"></span> Severidad máxima</li>
      </ul>
    </aside>
  </main>

  <div id="update-banner" class="update-banner" hidden role="status" aria-live="polite">
    <span>Hay una versión nueva de TráficoYa disponible.</span>
    <button id="update-reload-btn" type="button">Recargar</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
